name: Excavator (magpie)

on:
  workflow_dispatch:
  schedule:
    # every 15 minutes, offset from the top of the hour and from the hourly
    # Excavator run (:20), so the two never start from the same minute
    - cron: '7,22,37,52 * * * *'

concurrency:
  group: excavator-magpie
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  excavate:
    name: Excavate magpie
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Bucket
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: my_bucket
          # 需要完整历史做 rebase，避免与主 Excavator 的推送交错
          fetch-depth: 0
      - name: Checkout Scoop
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ScoopInstaller/Scoop
          path: scoop_core
      - name: Check magpie
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOOP_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $env:SCOOP_HOME = (Convert-Path '.\scoop_core')
          .\my_bucket\bin\checkver.ps1 -App magpie -Update
      - name: Commit and push
        shell: pwsh
        working-directory: my_bucket
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (git status --porcelain)) {
              Write-Host 'magpie: 无更新，跳过提交'
              exit 0
          }

          $version = (Get-Content -Raw 'bucket\magpie.json' | ConvertFrom-Json).version
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bucket/magpie.json
          git commit -m "chore: 更新 magpie 至 $version"

          # 主 Excavator 可能同时在推送，冲突时以远端为准并跳过本轮
          for ($i = 1; $i -le 3; $i++) {
              git pull --rebase origin master
              if ($LASTEXITCODE -ne 0) {
                  git rebase --abort
                  Write-Host 'magpie: 远端已更新，跳过本轮推送'
                  exit 0
              }
              git push origin HEAD:master
              if ($LASTEXITCODE -eq 0) {
                  Write-Host "magpie: 已推送 $version"
                  exit 0
              }
              Start-Sleep -Seconds 5
          }
          throw '推送失败'
